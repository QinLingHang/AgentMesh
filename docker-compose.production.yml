name: ${AGENTMESH_COMPOSE_PROJECT:-agentmesh-production}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agentmesh_mvp}
      MYSQL_USER: ${MYSQL_USER:-agentmesh}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s

  kafka-1:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    logging: *default-logging
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-24}
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    stop_grace_period: 30s

  kafka-2:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    logging: *default-logging
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: "2"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-24}
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    stop_grace_period: 30s

  kafka-3:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    logging: *default-logging
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: "3"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-24}
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    stop_grace_period: 30s

  kafka-init:
    image: apache/kafka:3.9.1
    restart: "no"
    logging: *default-logging
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      KAFKA_RUNTIME_PARTITIONS: ${KAFKA_RUNTIME_PARTITIONS:-24}
      KAFKA_EVENT_PARTITIONS: ${KAFKA_EVENT_PARTITIONS:-24}
      KAFKA_DLQ_PARTITIONS: ${KAFKA_DLQ_PARTITIONS:-6}
    command:
      - /bin/bash
      - -ec
      - |
        for topic in agentmesh.runtime.events agentmesh.tool.events agentmesh.model.events agentmesh.audit.events agentmesh.usage.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 --create --if-not-exists --topic "$$topic" --partitions "$${KAFKA_EVENT_PARTITIONS}" --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=604800000
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 --alter --topic agentmesh.runtime.events --partitions "$${KAFKA_RUNTIME_PARTITIONS}" || true
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 --create --if-not-exists --topic agentmesh.runtime.events.dlq --partitions "$${KAFKA_DLQ_PARTITIONS}" --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=1209600000

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    logging: *default-logging
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus_etcd_data:/etcd
    command: >-
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-agentmesh-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    volumes:
      - milvus_minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 5

  milvus:
    image: milvusdb/milvus:v3.0.0
    restart: unless-stopped
    logging: *default-logging
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-agentmesh-minio}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5

  migrate:
    build:
      context: ./backend-go
    restart: "no"
    logging: *default-logging
    command: ["/app/agentmesh-migrate"]
    environment: &backend-env
      BUSINESS_PORT: "8086"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agentmesh_mvp}
      MYSQL_USER: ${MYSQL_USER:-agentmesh}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      REDIS_ADDR: redis:6379
      REDIS_DB: "0"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_ISSUER: agentmesh-control-plane
      VERIFICATION_PEPPER: ${VERIFICATION_PEPPER:?set VERIFICATION_PEPPER}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS:-}
      EMAIL_AUTH_CODE: ${EMAIL_AUTH_CODE:-}
      EMAIL_APP_NAME: ${EMAIL_APP_NAME:-AgentMesh}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      RUNTIME_BASE_URL: http://runtime-python:9572
      RUNTIME_INTERNAL_TOKEN: ${RUNTIME_INTERNAL_TOKEN:?set RUNTIME_INTERNAL_TOKEN}
      MCP_DEMO_ENDPOINT: http://mcp-demo:9583/mcp
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      KNOWLEDGE_STORAGE_ROOT: /app/data/knowledge
      DURABLE_RUNTIME_ENABLED: "true"
      CONTROL_PLANE_INTERNAL_BASE_URL: http://backend-go:8086
      DURABLE_RUNTIME_MAX_QUEUE_DEPTH: ${DURABLE_RUNTIME_MAX_QUEUE_DEPTH:-500}
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_RUNTIME_EVENTS_TOPIC: ${KAFKA_RUNTIME_EVENTS_TOPIC:-agentmesh.runtime.events}
      KAFKA_RUNTIME_DLQ_TOPIC: ${KAFKA_RUNTIME_DLQ_TOPIC:-agentmesh.runtime.events.dlq}
      KAFKA_RUNTIME_CONSUMER_GROUP: ${KAFKA_RUNTIME_CONSUMER_GROUP:-agentmesh-control-plane-runtime-v1}
      KAFKA_PROCESS_MAX_ATTEMPTS: ${KAFKA_PROCESS_MAX_ATTEMPTS:-10}
      GOVERNANCE_MASTER_KEY: ${GOVERNANCE_MASTER_KEY:?set GOVERNANCE_MASTER_KEY}
    depends_on:
      mysql:
        condition: service_healthy

  backend-go:
    build:
      context: ./backend-go
    restart: unless-stopped
    logging: *default-logging
    environment: *backend-env
    volumes:
      - knowledge_data:/app/data/knowledge
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8086"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8086/readyz"]
      interval: 10s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s

  runtime-python:
    build:
      context: ./runtime-python
    restart: unless-stopped
    logging: *default-logging
    environment:
      INTERNAL_TOKEN: ${RUNTIME_INTERNAL_TOKEN:?set RUNTIME_INTERNAL_TOKEN}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      MODEL_NAME: ${MODEL_NAME:-qwen-plus}
      MODEL_VISION_NAME: ${MODEL_VISION_NAME:-qwen-vl-plus}
      MODEL_HTTP_TRUST_ENV: "false"
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
      RUNTIME_WORKER_ENABLED: "true"
      RUNTIME_WORKER_ID: ${RUNTIME_WORKER_ID:-runtime-compose-1}
      RUNTIME_WORKER_ENDPOINT: http://runtime-python:9572
      CONTROL_PLANE_INTERNAL_BASE_URL: http://backend-go:8086
      RUNTIME_WORKER_CAPACITY: ${RUNTIME_WORKER_CAPACITY:-4}
      RUNTIME_RESULT_TRANSPORT: kafka
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_RUNTIME_RESULT_TOPIC: ${KAFKA_RUNTIME_EVENTS_TOPIC:-agentmesh.runtime.events}
      KAFKA_CLIENT_ID: ${KAFKA_RUNTIME_CLIENT_ID:-agentmesh-runtime-python}
      KAFKA_OUTBOX_PATH: /app/data/runtime_result_outbox.sqlite3
      RERANKER_HTTP_TRUST_ENV: "false"
      EMBEDDING_HTTP_TRUST_ENV: "false"
    volumes:
      - runtime_outbox_data:/app/data
    depends_on:
      backend-go:
        condition: service_healthy
      milvus:
        condition: service_healthy
    expose:
      - "9572"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9572/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s

  mcp-demo:
    build:
      context: ./runtime-python
    restart: unless-stopped
    logging: *default-logging
    command: ["python", "-m", "app.mcp.demo_server"]
    environment:
      MCP_DEMO_HOST: 0.0.0.0
      MCP_DEMO_PORT: "9583"
    expose:
      - "9583"

  web-react:
    build:
      context: ./web-react
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend-go:
        condition: service_healthy
    expose:
      - "80"

  gateway:
    build:
      context: ./infra/gateway
    restart: unless-stopped
    logging: *default-logging
    environment:
      REQUIRE_TLS: ${REQUIRE_TLS:-false}
    volumes:
      - ${TLS_CERT_DIR:-./infra/gateway/tls}:/etc/agentmesh/tls:ro
    depends_on:
      backend-go:
        condition: service_healthy
      runtime-python:
        condition: service_healthy
      web-react:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/livez"]
      interval: 10s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
    name: ${DATA_VOLUME_PREFIX:-agentmesh-prod}-mysql-data
  redis_data:
    name: ${DATA_VOLUME_PREFIX:-agentmesh-prod}-redis-data
  kafka_1_data:
    name: ${DATA_VOLUME_PREFIX:-agentmesh-prod}-kafka-1-data
  kafka_2_data:
    name: ${DATA_VOLUME_PREFIX:-agentmesh-prod}-kafka-2-data
  kafka_3_data:
    name: ${DATA_VOLUME_PREFIX:-agentmesh-prod}-kafka-3-data
  runtime_outbox_data:
    name: ${DATA_VOLUME_PREFIX:-agentmesh-prod}-runtime-outbox-data
  milvus_etcd_data:
    name: ${DATA_VOLUME_PREFIX:-agentmesh-prod}-milvus-etcd-data
  milvus_minio_data:
    name: ${DATA_VOLUME_PREFIX:-agentmesh-prod}-milvus-minio-data
  milvus_data:
    name: ${DATA_VOLUME_PREFIX:-agentmesh-prod}-milvus-data
  knowledge_data:
    name: ${DATA_VOLUME_PREFIX:-agentmesh-prod}-knowledge-data
