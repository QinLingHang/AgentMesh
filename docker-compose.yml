services:
  mysql:
    image: mysql:8.4
    container_name: agentmesh-mvp02-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: agentmesh_mvp
      MYSQL_USER: agentmesh
      MYSQL_PASSWORD: agentmesh123
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uagentmesh -pagentmesh123"
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    container_name: agentmesh-mvp02-redis
    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 30


  # ========================================================
  # P21 Kafka Event Plane (KRaft, single-node dev)
  # ========================================================

  kafka:
    image: apache/kafka:3.9.1
    container_name: agentmesh-mvp02-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 12
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: agentmesh-mvp02-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command:
      - /bin/bash
      - -ec
      - |
        for topic in agentmesh.runtime.events agentmesh.tool.events agentmesh.model.events agentmesh.audit.events agentmesh.usage.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 12 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic agentmesh.runtime.events.dlq --partitions 3 --replication-factor 1

  # ========================================================
  # Milvus Metadata Store
  # ========================================================

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: agentmesh-mvp02-milvus-etcd

    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000

    volumes:
      - milvus_etcd_data:/etcd

    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd

    healthcheck:
      test:
        [
          "CMD",
          "etcdctl",
          "endpoint",
          "health"
        ]
      interval: 30s
      timeout: 20s
      retries: 5

  # ========================================================
  # Milvus Object Storage
  # ========================================================

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: agentmesh-mvp02-milvus-minio

    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

    volumes:
      - milvus_minio_data:/minio_data

    command:
      minio server /minio_data --console-address ":9001"

    healthcheck:
      test:
        [
          "CMD",
          "mc",
          "ready",
          "local"
        ]
      interval: 30s
      timeout: 20s
      retries: 5

  # ========================================================
  # Milvus Standalone
  # ========================================================

  milvus:
    image: milvusdb/milvus:v3.0.0
    container_name: agentmesh-mvp02-milvus

    command:
      [
        "milvus",
        "run",
        "standalone"
      ]

    security_opt:
      - seccomp:unconfined

    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000

    volumes:
      - milvus_data:/var/lib/milvus

    ports:
      - "19530:19530"
      - "9091:9091"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9091/healthz"
        ]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5

    depends_on:
      - etcd
      - minio


volumes:
  mysql_data:
  redis_data:
  kafka_data:

  milvus_etcd_data:
  milvus_minio_data:
  milvus_data: