# V3 optional HA/multi-node overlay.
# Usage:
#   docker compose -f docker-compose.production.yml -f docker-compose.v3-ha.yml up -d --build
#
# This keeps the normal production topology unchanged unless the overlay is
# explicitly selected. It adds a standby Go control-plane dispatcher and a
# second Runtime node, while the gateway load-balances API traffic across both
# Go replicas.

services:
  backend-go:
    environment:
      DURABLE_RUNTIME_DISPATCHER_ID: dispatcher-a
      CONTROL_PLANE_INTERNAL_BASE_URL: http://backend-go:8086

  backend-go-b:
    extends:
      file: docker-compose.production.yml
      service: backend-go
    environment:
      DURABLE_RUNTIME_DISPATCHER_ID: dispatcher-b
      CONTROL_PLANE_INTERNAL_BASE_URL: http://backend-go-b:8086
      KAFKA_OUTBOX_PATH: /app/data/runtime_result_outbox.sqlite3
    volumes:
      - runtime_outbox_b:/app/data
    expose:
      - "8086"

  runtime-python:
    environment:
      RUNTIME_WORKER_ID: runtime-node-a-worker-1
      KAFKA_CLIENT_ID: agentmesh-runtime-node-a
      RUNTIME_WORKER_ENDPOINT: http://runtime-python:9572
      RUNTIME_NODE_ID: runtime-node-a
      RUNTIME_NODE_ZONE: zone-a
      RUNTIME_NODE_VERSION: 3.0.0-dev
      RUNTIME_NODE_CAPACITY: ${RUNTIME_NODE_A_CAPACITY:-4}
      CONTROL_PLANE_INTERNAL_BASE_URL: http://backend-go:8086

  runtime-python-b:
    extends:
      file: docker-compose.production.yml
      service: runtime-python
    environment:
      RUNTIME_WORKER_ID: runtime-node-b-worker-1
      KAFKA_CLIENT_ID: agentmesh-runtime-node-b
      RUNTIME_WORKER_ENDPOINT: http://runtime-python-b:9572
      RUNTIME_NODE_ID: runtime-node-b
      RUNTIME_NODE_ZONE: zone-b
      RUNTIME_NODE_VERSION: 3.0.0-dev
      RUNTIME_NODE_CAPACITY: ${RUNTIME_NODE_B_CAPACITY:-4}
      CONTROL_PLANE_INTERNAL_BASE_URL: http://backend-go-b:8086
      KAFKA_OUTBOX_PATH: /app/data/runtime_result_outbox.sqlite3
    volumes:
      - runtime_outbox_b:/app/data
    expose:
      - "9572"

  gateway:
    environment:
      ENABLE_CONTROL_PLANE_HA: "true"
    depends_on:
      backend-go:
        condition: service_healthy
      backend-go-b:
        condition: service_healthy
      runtime-python:
        condition: service_healthy
      runtime-python-b:
        condition: service_healthy
      web-react:
        condition: service_started

volumes:
  runtime_outbox_b:
    name: ${DATA_VOLUME_PREFIX:-agentmesh-prod}-runtime-outbox-b-data
