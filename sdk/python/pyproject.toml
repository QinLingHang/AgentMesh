[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmesh-sdk"
version = "4.0.0.dev0"
description = "Official dependency-free Python client for the AgentMesh V4 Public API"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools]
packages = ["agentmesh"]
